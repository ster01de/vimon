name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore Vimon.sln
      - run: dotnet build Vimon.sln -c Release --no-restore
      - run: dotnet test Vimon.sln -c Release --no-build

  macos:
    runs-on: macos-latest
    # EnableWindowsTargeting comes from Directory.Build.props, so local builds behave the same.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/Vimon.Cli/Vimon.Cli.csproj -c Release -f net8.0
      # Same command the README gives for macOS / Linux contributors.
      - run: dotnet test Vimon.sln -c Release
      - name: Smoke test one-shot output
        run: |
          output=$(dotnet run --project src/Vimon.Cli/Vimon.Cli.csproj -c Release -f net8.0 --no-build -- --once)
          echo "$output"
          grep -q "Thermal" <<< "$output"
          grep -q "Pressure" <<< "$output"
          grep -q "NETWORK" <<< "$output"
      - name: Smoke test widget output
        run: |
          output=$(dotnet run --project src/Vimon.Cli/Vimon.Cli.csproj -c Release -f net8.0 --no-build -- --once --widget)
          echo "$output"
          grep -q "^CPU" <<< "$output"
          # The widget sits on a transparent desktop panel: no borders, header or key help.
          if grep -q -e "╭" -e "│" -e "VIMON" <<< "$output"; then exit 1; fi
      - name: Unknown options fail with a message
        run: |
          if dotnet run --project src/Vimon.Cli/Vimon.Cli.csproj -c Release -f net8.0 --no-build -- --bogus 2> err.txt; then exit 1; fi
          grep -q "unknown option '--bogus'" err.txt
      - name: Publish macOS arm64 preview
        run: |
          dotnet publish src/Vimon.Cli/Vimon.Cli.csproj -c Release -f net8.0 -r osx-arm64 \
            --self-contained true -p:PublishSingleFile=true -o dist/osx-arm64
          # Artifacts drop the executable bit, so ship a tarball that keeps it.
          tar -czf vimon-macos-arm64.tar.gz -C dist/osx-arm64 vimon
      - uses: actions/upload-artifact@v4
        with:
          name: vimon-macos-arm64
          path: vimon-macos-arm64.tar.gz
          retention-days: 14
