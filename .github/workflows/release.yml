name: release

on:
  push:
    tags:
      - "v*"
  # Manual runs build and smoke-test every binary; only tag pushes publish a release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish Windows x64
        run: >
          dotnet publish
          .\src\Vimon.Cli\Vimon.Cli.csproj
          -c Release
          -f net8.0-windows
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o .\dist\win-x64

      - name: Rename binary
        shell: pwsh
        run: |
          Copy-Item ".\dist\win-x64\vimon.exe" ".\vimon-windows-x64.exe"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: vimon-windows-x64.exe

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    env:
      RID: osx-${{ matrix.arch }}
      ARCHIVE: vimon-macos-${{ matrix.arch }}.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: |
          dotnet publish src/Vimon.Cli/Vimon.Cli.csproj -c Release -f net8.0 -r "$RID" \
            --self-contained true -p:PublishSingleFile=true -o "dist/$RID"

      # The runner is Apple Silicon, so only the native arm64 binary can be started here.
      - name: Smoke test
        if: matrix.arch == 'arm64'
        run: |
          output=$("dist/$RID/vimon" --once)
          echo "$output"
          grep -q "STATUS" <<< "$output"

      # A tarball keeps the executable bit, which plain artifacts and browser downloads drop.
      - name: Package
        run: tar -czf "$ARCHIVE" -C "dist/$RID" vimon

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: ${{ env.ARCHIVE }}

  publish:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vimon-windows-x64.exe
            dist/vimon-macos-arm64.tar.gz
            dist/vimon-macos-x64.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
